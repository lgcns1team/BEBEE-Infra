apiVersion: apps/v1
kind: Deployment
metadata:
  name: member-service
  namespace: bebee
  labels:
    app: member-service
    app.kubernetes.io/name: member-service
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: bebee
spec:
  replicas: 1
  selector:
    matchLabels:
      app: member-service
  template:
    metadata:
      labels:
        app: member-service
        app.kubernetes.io/name: member-service
        app.kubernetes.io/component: backend
    spec:
      containers:
      - name: member-service
        image: bebee-member-service:latest
        ports:
        - name: http
          protocol: TCP
          containerPort: 8080

        envFrom:
          - secretRef:
              name: member-service-env

        livenessProbe:
          httpGet:
            path: /member/actuator/health
            port: 8080
          initialDelaySeconds: 20
