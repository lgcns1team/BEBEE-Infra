apiVersion: v1
kind: ServiceAccount
metadata:
  name: member-service-secrets-sa
  namespace: bebee
  annotations:
    # IRSA를 통한 Secrets Manager 접근 권한
    # Terraform의 module.secret_jwt에서 생성된 통합 IAM Role
    eks.amazonaws.com/role-arn: arn:aws:iam::383488877070:role/bebee-dev-secrets-manager-access-role
  labels:
    app: member-service
    environment: dev
    component: external-secrets
