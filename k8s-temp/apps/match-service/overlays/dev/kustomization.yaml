apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: bebee

resources:
  - ../../base
  - secret-manager-sa.yaml
  - secret-store.yaml
  - external-secret.yaml

labels:
- pairs:
    environment: dev

configMapGenerator:
  - name: match-service-config
    files:
      - application.yaml=application-dev.yaml

images:
  - name: bebee-match-service
    newName: 383488877070.dkr.ecr.ap-northeast-2.amazonaws.com/bebee-match-service
    newTag: 2b202de582d8113314330e3f0d2cd0ada9e261b1

patches:
  - path: deployment-patch.yaml
