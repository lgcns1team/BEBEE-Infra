apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: bebee

resources:
  - ../../base
  - secret-manager-sa.yaml
  - secret-store.yaml
  - external-secret.yaml

labels:
- pairs:
    environment: dev

configMapGenerator:
  - name: gateway-config
    files:
      - application.yaml=application-dev.yaml

images:
  - name: bebee-gateway
    newName: 383488877070.dkr.ecr.ap-northeast-2.amazonaws.com/bebee-gateway-service
    newTag: latest

patches:
  - path: deployment-patch.yaml