apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gateway-secrets
  namespace: bebee
spec:
  # 5분마다 Secrets Manager에서 값을 동기화
  refreshInterval: 5m

  # SecretStore 참조
  secretStoreRef:
    name: gateway-sm
    kind: SecretStore

  # 생성될 Kubernetes Secret 이름
  target:
    name: gateway-env
    creationPolicy: Owner
    template:
      type: Opaque
      mergePolicy: Merge
      metadata:
        labels:
          app: gateway
          environment: dev
      data:
        SERVER_PORT: "8080"
        SPRING_PROFILES_ACTIVE: "dev"
        SPRINGDOC_API_HOST: "https://api.be-bee.link"
        SPRINGDOC_API_DESC: "개발 서버 - API Gateway"
        CORS_ALLOWED_ORIGINS: "https://be-bee.link"

        # 마이크로서비스 URL 설정
        SERVICE_MEMBER_URL: "http://member-service.bebee.svc.cluster.local"
        SERVICE_MATCH_URL: "http://match-service.bebee.svc.cluster.local"
        SERVICE_CHAT_URL: "http://chat-service.bebee.svc.cluster.local"
        SERVICE_NOTIFICATION_URL: "http://notification-service.bebee.svc.cluster.local"
        SERVICE_PAYMENT_URL: "http://payment-service.bebee.svc.cluster.local"
        SERVICE_FILE_URL: "http://file-service.bebee.svc.cluster.local"

  # AWS Secrets Manager에서 가져올 데이터
  data:
    - secretKey: AWS_REGION
      remoteRef: { key: bebee-dev-aws-config, property: region}

    # Redis 설정
    - secretKey: REDIS_HOST
      remoteRef: { key: bebee-dev-redis-credentials, property: primary_endpoint }

    - secretKey: REDIS_PORT
      remoteRef: { key: bebee-dev-redis-credentials, property: port }

    # JWT Secret (Gateway에서 토큰 검증용)
    - secretKey: JWT_SECRET
      remoteRef: { key: bebee-dev-jwt-secret, property: jwt_secret }

    - secretKey: JWT_ISSUER
      remoteRef: { key: bebee-dev-jwt-secret, property: issuer }

    - secretKey: JWT_ACCESS_EXPIRES_IN
      remoteRef: { key: bebee-dev-jwt-secret, property: access_token_expires_in }

    - secretKey: JWT_REFRESH_EXPIRES_IN
      remoteRef: { key: bebee-dev-jwt-secret, property: refresh_token_expires_in }