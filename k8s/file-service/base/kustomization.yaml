  - deployment.yaml
  - service.yaml
  - service-account.yaml

# 공통 레이블
commonLabels:
  app: file-service
  app.kubernetes.io/name: file-service
  app.kubernetes.io/component: backend
  app.kubernetes.io/part-of: bebee