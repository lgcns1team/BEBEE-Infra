apiVersion: v1
kind: ServiceAccount
metadata:
  name: bebee-s3-sa
  namespace: bebee
  annotations:
    # IRSA를 통한 S3 접근 권한
    # Terraform의 module.s3_images에서 생성된 IAM Role
    eks.amazonaws.com/role-arn: arn:aws:iam::383488877070:role/bebee-dev-images-eks-access-role
  labels:
    app: file-service
    environment: dev