apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: match-service-secrets
  namespace: bebee
spec:
  # 5분마다 Secrets Manager에서 값을 동기화
  refreshInterval: 5m

  # SecretStore 참조
  secretStoreRef:
    name: match-service-sm
    kind: SecretStore

  # 생성될 Kubernetes Secret 이름
  target:
    name: match-service-env
    creationPolicy: Owner
    template:
      type: Opaque
      mergePolicy: Merge
      metadata:
        labels:
          app: match-service
          environment: dev
      data:
        SERVER_PORT: "8080"
        SPRING_PROFILES_ACTIVE: "dev"
        SPRINGDOC_API_HOST: "https://api.be-bee.link/match"
        SPRINGDOC_API_DESC: "개발 서버 - MATCH 서비스"
        CORS_ALLOWED_ORIGINS: "https://be-bee.link"

  # AWS Secrets Manager에서 가져올 데이터
  data:
    - secretKey: AWS_REGION
      remoteRef: { key: bebee-dev-aws-config, property: region}
    - secretKey: DB_HOST
      remoteRef: { key: bebee-dev-match-db-credentials, property: host }
    - secretKey: DB_PORT
      remoteRef: { key: bebee-dev-match-db-credentials, property: port }
    - secretKey: DB_NAME
      remoteRef: { key: bebee-dev-match-db-credentials, property: dbname }
    - secretKey: DB_USERNAME
      remoteRef: { key: bebee-dev-match-db-credentials, property: username }
    - secretKey: DB_PASSWORD
      remoteRef: { key: bebee-dev-match-db-credentials, property: password }
    - secretKey: KAKAO_API_KEY
      remoteRef: { key: bebee-dev-external-api, property: kakao_api_key }
