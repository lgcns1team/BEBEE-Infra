#  allowed-methods: "${CORS_ALLOWED_METHODS:GET,POST,PUT,PATCH,DELETE,OPTIONS}"
#  allowed-headers: "${CORS_ALLOWED_HEADERS:*}"
#  exposed-headers: "${CORS_EXPOSED_HEADERS:}"
#  allow-credentials: ${CORS_ALLOW_CREDENTIALS:true}
#  max-age: ${CORS_MAX_AGE:3600}

event: aws

app:
  sns:
    match-topic-arn: "${AWS_SNS_TOPIC_ARN:arn:aws:sns:ap-northeast-2:383488877070:bebee-dev-match-topic}"
  sqs:
    match-queue-url: "${AWS_SQS_QUEUE_URL:https://sqs.ap-northeast-2.amazonaws.com/383488877070/bebee-dev-match-queue}"

kakao:
  api:
    key: "${KAKAO_API_KEY}"

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: false

logging:
  level:
    root: ${LOGGING_LEVEL_ROOT:info}
    com.lgcns.bebee.match: ${LOGGING_LEVEL_SERVICE:INFO}