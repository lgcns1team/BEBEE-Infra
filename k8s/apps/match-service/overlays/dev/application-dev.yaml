server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path:

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false&autoReconnect=true&useUnicode=true&characterEncoding=UTF-8
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-test-query: SELECT 1
      validation-timeout: 5000
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 30000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: ${HIBERNATE_DDL_AUTO:none}
      show-sql: ${SHOW_SQL:false}
      properties:
        hibernate:
          format_sql: ${FORMAT_SQL:false}

  cloud:
    aws:
      region:
        static: ap-northeast-2

  flyway:
    ignore-migration-patterns: "*:.backup/*"
    enabled: true
    locations:
      - classpath:db/migration
      - classpath:db/seed
    encoding: UTF-8
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true
    out-of-order: false
    placeholder-replacement: false

springdoc:
  api-docs:
    path: /api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    tags-sorter: alpha
    operations-sorter: alpha
  default-consumes-media-type: application/json
  default-produces-media-type: application/json

  api:
    desc: "${SPRINGDOC_API_DESC:dev server}"

#cors:
