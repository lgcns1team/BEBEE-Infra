apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: bebee

resources:
  - ../../base
  - secret-manager-sa.yaml
  - messaging-sa.yaml
  - secret-store.yaml
  - external-secret.yaml

labels:
- pairs:
    environment: dev

configMapGenerator:
  - name: match-service-config
    files:
      - application.yaml=application-dev.yaml

images:
  - name: bebee-match-service
    newName: 383488877070.dkr.ecr.ap-northeast-2.amazonaws.com/bebee-match-service
    newTag: fff3e369caaaa50b6f7745e45f7feb3411b5c298

patches:
  - path: deployment-patch.yaml
