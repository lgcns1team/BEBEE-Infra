apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: bebee

resources:
  - ../../base
  - secret-manager-sa.yaml
  - messaging-sa.yaml
  - secret-store.yaml
  - external-secret.yaml

labels:
- pairs:
    environment: dev

configMapGenerator:
  - name: match-service-config
    files:
      - application.yaml=application-dev.yaml

images:
  - name: bebee-match-service
    newName: 383488877070.dkr.ecr.ap-northeast-2.amazonaws.com/bebee-match-service
    newTag: dd6c31a4e688d387b903719da0ece758e4826e42

patches:
  - path: deployment-patch.yaml
