apiVersion: apps/v1
kind: Deployment
metadata:
  name: match-service
  namespace: bebee
spec:
  template:
    spec:
      serviceAccountName: match-service-messaging-sa
      containers:
      - name: match-service
        volumeMounts:
          - name: config
            mountPath: /app/config
      volumes:
      - name: config
        configMap:
          name: match-service-config
