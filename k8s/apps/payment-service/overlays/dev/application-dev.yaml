server:
  port: ${SERVER_PORT:8080}

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME:}?serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false&autoReconnect=true&useUnicode=true&characterEncoding=UTF-8
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-test-query: SELECT 1
      validation-timeout: 5000
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 30000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: ${HIBERNATE_DDL_AUTO:none}
      show-sql: ${SHOW_SQL:false}
      properties:
        hibernate:
          format_sql: ${FORMAT_SQL:false}

  data:
    redis:
      # Redis Host
      host: ${REDIS_HOST:}
      # Redis Port
      port: ${REDIS_PORT:}

  flyway:
    enabled: true
    locations:
      - classpath:db/migration
      - classpath:db/seed
    encoding: UTF-8
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true
    out-of-order: false
    placeholder-replacement: false

springdoc:
  api-docs:
    path: /api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    tags-sorter: alpha
    operations-sorter: alpha
  default-consumes-media-type: application/json
  default-produces-media-type: application/json

  api:
    desc: "${SPRINGDOC_API_DESC:dev server}"

tsid:
  node:
    id: ${NODE_ID:0}
toss:
  payments:
    base-url: https://api.tosspayments.com
    secret-key: ${TOSS_SECRET_KEY}
    client-key: ${TOSS_CLIENT_KEY}
    timeout: 10000
    api-version: "2022-11-16"

logging:
  level:
    root: ${LOGGING_LEVEL_ROOT:INFO}
    org.hibernate.SQL: DEBUG
    org.hibernate.type: TRACE
    com.lgcns.bebee.payment: ${LOGGING_LEVEL_SERVICE:INFO}
