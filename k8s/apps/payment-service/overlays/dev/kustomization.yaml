apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: bebee

resources:
  - ../../base
  - secret-manager-sa.yaml
  - messaging-sa.yaml
  - secret-store.yaml
  - external-secret.yaml

labels:
- pairs:
    environment: dev

configMapGenerator:
  - name: payment-service-config
    files:
      - application.yaml=application-dev.yaml

images:
  - name: bebee-payment-service
    newName: 383488877070.dkr.ecr.ap-northeast-2.amazonaws.com/bebee-payment-service
    newTag: 243099a5b3ae0f090607b4789ee20dcec97ef618

patches:
  - path: deployment-patch.yaml
