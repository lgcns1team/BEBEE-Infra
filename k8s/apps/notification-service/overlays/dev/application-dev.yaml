server:
  port: ${SERVER_PORT:8080}

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME:}?serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false&autoReconnect=true&useUnicode=true&characterEncoding=UTF-8
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-test-query: SELECT 1
      validation-timeout: 5000
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 30000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: ${HIBERNATE_DDL_AUTO:none}
      show-sql: ${SHOW_SQL:false}
      properties:
        hibernate:
          format_sql: ${FORMAT_SQL:false}

  flyway:
    enabled: true
    locations:
      - classpath:db/migration
      - classpath:db/seed
    encoding: UTF-8
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true
    out-of-order: false
    placeholder-replacement: false

  cloud:
    aws:
      region:
        static: ap-northeast-2

springdoc:
  api-docs:
    path: /api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    tags-sorter: alpha
    operations-sorter: alpha
  default-consumes-media-type: application/json
  default-produces-media-type: application/json

  api:
    desc: "${SPRINGDOC_API_DESC:dev server}"

app:
  sqs:
    queue-url: "${AWS_SQS_QUEUE_URL:https://sqs.ap-northeast-2.amazonaws.com/383488877070/bebee-dev-notification-queue}"

# FCM 설정
firebase:
  # 서비스 계정 키 파일 경로
  service-account-key-path: ${FIREBASE_SERVICE_ACCOUNT_KEY_PATH:classpath:firebase/firebase-service-account.json}

logging:
  level:
    root: ${LOGGING_LEVEL_ROOT:INFO}
    com.lgcns.bebee.notification: ${LOGGING_LEVEL_SERVICE:INFO}
