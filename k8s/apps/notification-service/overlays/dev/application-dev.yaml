server:
  port: ${SERVER_PORT:8080}

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME:}?serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false&autoReconnect=true&useUnicode=true&characterEncoding=UTF-8
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-test-query: SELECT 1
      validation-timeout: 5000
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 30000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: ${HIBERNATE_DDL_AUTO:none}
      show-sql: ${SHOW_SQL:false}
      properties:
        hibernate:
          format_sql: ${FORMAT_SQL:false}

  flyway:
    enabled: true
    locations:
      - classpath:db/migration
      - classpath:db/seed
    encoding: UTF-8
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true
    out-of-order: false
    placeholder-replacement: false

springdoc:
  api-docs:
    path: /api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    tags-sorter: alpha
    operations-sorter: alpha
  default-consumes-media-type: application/json
  default-produces-media-type: application/json

  api:
    desc: "${SPRINGDOC_API_DESC:dev server}"

cors:
  allowed-origin-patterns: "${CORS_ALLOWED_ORIGINS:http://localhost:[*],https://localhost:[*]}"
  allowed-methods: "${CORS_ALLOWED_METHODS:GET,POST,PUT,PATCH,DELETE,OPTIONS}"
  allowed-headers: "${CORS_ALLOWED_HEADERS:*}"
  exposed-headers: "${CORS_EXPOSED_HEADERS:}"
  allow-credentials: ${CORS_ALLOW_CREDENTIALS:true}
  max-age: ${CORS_MAX_AGE:3600}

logging:
  level:
    root: ${LOGGING_LEVEL_ROOT:INFO}
    com.lgcns.bebee.notification: ${LOGGING_LEVEL_SERVICE:INFO}
