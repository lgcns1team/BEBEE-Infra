apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: notification-service-secrets
  namespace: bebee
spec:
  refreshInterval: 5m

  secretStoreRef:
    name: notification-service-sm
    kind: SecretStore

  target:
    name: notification-service-env
    creationPolicy: Owner
    template:
      type: Opaque
      mergePolicy: Merge
      metadata:
        labels:
          app: notification-service
          environment: dev
      data:
        SERVER_PORT: "8080"
        SPRING_PROFILES_ACTIVE: "dev"
        SPRINGDOC_API_HOST: "https://api.be-bee.link/notification"
        SPRINGDOC_API_DESC: "개발 서버 - NOTIFICATION 서비스"
        CORS_ALLOWED_ORIGINS: "https://be-bee.link"

  data:
    - secretKey: DB_HOST
      remoteRef: { key: bebee-dev-notification-db-credentials, property: host }
    - secretKey: DB_PORT
      remoteRef: { key: bebee-dev-notification-db-credentials, property: port }
    - secretKey: DB_NAME
      remoteRef: { key: bebee-dev-notification-db-credentials, property: dbname }
    - secretKey: DB_USERNAME
      remoteRef: { key: bebee-dev-notification-db-credentials, property: username }
    - secretKey: DB_PASSWORD
      remoteRef: { key: bebee-dev-notification-db-credentials, property: password }
