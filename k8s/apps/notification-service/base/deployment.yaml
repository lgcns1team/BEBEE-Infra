apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: bebee
  labels:
    app: notification-service
    app.kubernetes.io/name: notification-service
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: bebee
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
        app.kubernetes.io/name: notification-service
        app.kubernetes.io/component: backend
    spec:
      containers:
      - name: notification-service
        image: bebee-notification-service:latest
        ports:
        - name: http
          protocol: TCP
          containerPort: 8080

        envFrom:
          - secretRef:
              name: notification-service-env

        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 100
