apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: bebee

resources:
  - ../../base
  - secret-manager-sa.yaml
  - messaging-sa.yaml
  - secret-store.yaml
  - external-secret.yaml

labels:
- pairs:
    environment: dev

configMapGenerator:
  - name: member-service-config
    files:
      - application.yaml=application-dev.yaml

images:
  - name: bebee-member-service
    newName: 383488877070.dkr.ecr.ap-northeast-2.amazonaws.com/bebee-member-service
    newTag: c02ea8ae0992b87fd17acafe7e5b652bcbc0e834

patches:
  - path: deployment-patch.yaml
