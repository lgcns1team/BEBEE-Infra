apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: bebee

resources:
  - ../../base
  - secret-manager-sa.yaml
  - messaging-sa.yaml
  - secret-store.yaml
  - external-secret.yaml

labels:
- pairs:
    environment: dev

configMapGenerator:
  - name: member-service-config
    files:
      - application.yaml=application-dev.yaml

images:
  - name: bebee-member-service
    newName: 383488877070.dkr.ecr.ap-northeast-2.amazonaws.com/bebee-member-service
    newTag: 91811ddfcb22a3156a486936ac92846c00cb3165

patches:
  - path: deployment-patch.yaml
