server:
  port: ${SERVER_PORT:8080}

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME:}?serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false&autoReconnect=true&useUnicode=true&characterEncoding=UTF-8
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-test-query: SELECT 1
      validation-timeout: 5000
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 30000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: ${HIBERNATE_DDL_AUTO:none}
      show-sql: ${SHOW_SQL:false}
      properties:
        hibernate:
          format_sql: ${FORMAT_SQL:false}

  # Redis 설정
  data:
    redis:
      # Redis Host
      host: ${REDIS_HOST:localhost}
      # Redis Port
      port: ${REDIS_PORT:6379}

  cloud:
    aws:
      region:
        static: ap-northeast-2

  flyway:
    enabled: true
    locations:
      - classpath:db/migration
#      - classpath:db/seed
    encoding: UTF-8
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true
    out-of-order: false
    placeholder-replacement: false

springdoc:
  api-docs:
    path: /api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
  default-consumes-media-type: application/json
  default-produces-media-type: application/json

  api:
    host: "${SPRINGDOC_API_HOST:}"
    desc: "${SPRINGDOC_API_DESC:dev server}"

jwt:
  secret: ${JWT_SECRET:}
  issuer: ${JWT_ISSUER:}
  access-token-expires-time-in: ${JWT_ACCESS_TOKEN_EXPIRES_IN:}
  refresh-token-expires-time-in: ${JWT_REFRESH_TOKEN_EXPIRES_IN:}

# OCR 서비스 설정
ocr:
  base-url: ${OCR_SERVICE_URL:}
  timeout: ${OCR_TIMEOUT:90000}

app:
  sns:
    topic-arn: "${AWS_SNS_TOPIC_ARN:arn:aws:sns:ap-northeast-2:383488877070:bebee-dev-member-topic}"
  sqs:
    queue-url: "${AWS_SQS_QUEUE_URL:https://sqs.ap-northeast-2.amazonaws.com/383488877070/bebee-dev-member-queue}"


logging:
  level:
    root: ${LOGGING_LEVEL_ROOT:INFO}
    com.lgcns.bebee.member: ${LOGGING_LEVEL_SERVICE:INFO}
