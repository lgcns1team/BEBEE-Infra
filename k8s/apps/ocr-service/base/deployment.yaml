apiVersion: apps/v1
kind: Deployment
metadata:
  name: ocr-service
  namespace: bebee
  labels:
    app: ocr-service
    app.kubernetes.io/name: ocr-service
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: bebee
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ocr-service
  template:
    metadata:
      labels:
        app: ocr-service
        app.kubernetes.io/name: ocr-service
        app.kubernetes.io/component: backend
    spec:
      containers:
        - name: ocr-service
          image: bebee-ocr-service:latest
          ports:
            - name: http
              protocol: TCP
              containerPort: 8080

          startupProbe:
            httpGet:
              path: /health
              port: 8080
            failureThreshold: 30
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 0
            timeoutSeconds: 5
            periodSeconds: 20