apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: bebee
spec:
  template:
    spec:
      serviceAccountName: gateway-secrets-sa
      containers:
      - name: gateway
        volumeMounts:
          - name: config
            mountPath: /app/config
      volumes:
      - name: config
        configMap:
          name: gateway-config