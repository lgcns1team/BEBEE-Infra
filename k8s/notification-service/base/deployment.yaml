apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: bebee
  labels:
    app: notification-service
    app.kubernetes.io/name: notification-service
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: bebee
spec:
  replicas: 2
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
        app.kubernetes.io/name: notification-service
        app.kubernetes.io/component: backend
    spec:
      containers:
        - name: notification-service
          image: bebe-notification-service:latest
          
          ports:
            - containerPort: 8080
              name: http
          
          envFrom:
            - secretRef:
                name: notification-service-env
