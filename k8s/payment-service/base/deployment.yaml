apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: bebee
  labels:
    app: payment-service
    app.kubernetes.io/name: payment-service
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: bebee
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
        app.kubernetes.io/name: payment-service
        app.kubernetes.io/component: backend
    spec:
      containers:
        - name: payment-service
          image: bebe-payment-service:latest
          
          ports:
            - containerPort: 8080
              name: http
          
          envFrom:
            - secretRef:
                name: payment-service-env
