apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: bebee

resources:
  - ../../base

commonLabels:
  environment: dev

configMapGenerator:
  - name: payment-service-config
    payments:
      - application.yaml=application-dev.yaml

images:
  - name: 383488877070.dkr.ecr.ap-northeast-2.amazonaws.com/bebee-payment-service
    newTag: latest

patchesStrategicMerge:
  - deployment-patch.yaml